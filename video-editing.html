<script>
/* ==========================================================
   ADD YOUR YOUTUBE VIDEOS HERE
   Paste a YouTube video, Shorts, youtu.be, or live link.
   Example:
   { url: "https://www.youtube.com/watch?v=ABC123", title: "My Reel" }
   ========================================================== */
const youtubeVideos = [
  { url: "https://youtube.com/shorts/kFxKf4LLzx0?feature=share", title: "Reel / Short-form Edit" },
  // { url: "https://www.youtube.com/watch?v=YOUR_VIDEO_ID", title: "Brand Promo" },
  // { url: "https://www.youtube.com/watch?v=YOUR_VIDEO_ID", title: "Event Recap" },
];

function youtubeId(url) {
  try {
    const u = new URL(url);
    if (u.hostname.includes('youtu.be')) return u.pathname.slice(1).split('/')[0];
    if (u.hostname.includes('youtube.com')) return u.searchParams.get('v') || (u.pathname.match(/\/(?:embed|shorts|live)\/([^/?]+)/) || [])[1] || '';
  } catch(e) {}
  return '';
}

const gallery = document.getElementById('videoGallery');
const validVideos = youtubeVideos
  .map(v => ({...v, id: youtubeId(v.url)}))
  .filter(v => v.id);

if (!validVideos.length) {
  gallery.innerHTML = `
    <div class="video-empty">
      <h3>Video projects coming soon</h3>
      <p>New video editing projects will appear here.</p>
    </div>`;
} else {
  gallery.innerHTML = validVideos.map((video, index) => `
    <article class="project-card video-card reveal">
      <div class="project-media video-media">
        <iframe
          src="https://www.youtube.com/embed/${video.id}"
          title="${escapeHtml(video.title || 'Video Editing Project')}"
          loading="lazy"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen></iframe>
      </div>
      <div class="project-info">
        <h3>${escapeHtml(video.title || `Video Project ${index + 1}`)}</h3>
        <p>Video editing project</p>
      </div>
    </article>`).join('');
}

function escapeHtml(value) {
  return String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
}
</script>
<script src="script.js"></script>
